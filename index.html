<!DOCTYPE html>
<html>
  <head>
    <title>World Temperature Search</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        padding: 30px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 20px;
      }

      .form-row {
        margin-bottom: 12px;
      }

      label {
        display: inline-block;
        width: 120px;
        font-weight: bold;
      }

      input {
        padding: 8px;
        width: 250px;
      }

      button {
        margin-top: 20px;
        padding: 10px 18px;
        background: #3a82f7;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }

      #results {
        margin-top: 30px;
        padding: 20px;
        background: #222;
        border-radius: 8px;
        white-space: pre-wrap;
        font-family: monospace;
      }
    </style>
  </head>

  <body>

    <h1>World Temperature Search</h1>

    <div class="form-row">
      <label>Category:</label>
      <select id="category">
        <option value="">(None)</option>
        <option>Region</option>
        <option>Country</option>
        <option>State</option>
        <option>City</option>
        <option>Month</option>
        <option>Year</option>
      </select>
    </div>

    <div class="form-row">
      <label>Value:</label>
      <input type="text" id="value" placeholder="Texas, Japan, 2000, etc">
    </div>

    <button onclick="runSearch()">Search Min/Max</button>

    <div id="results">Results will appear here...</div>

    <script>
      async function runSearch() {
        const category = document.getElementById("category").value;
        const value = document.getElementById("value").value;

        const query = new URLSearchParams({
          category,
          value
        });

        const res = await fetch("/api/search?" + query.toString());
        const text = await res.text();

        document.getElementById("results").textContent = text;
      }
    </script>

  </body>
</html>
